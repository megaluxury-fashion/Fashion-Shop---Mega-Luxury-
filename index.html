        // --- APP COMPONENTS ---
        function App() {
            const [currentView, setCurrentView] = useState('home'); 
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [cart, setCart] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [toast, setToast] = useState(null);

            const navigate = (view, data = null) => {
                setCurrentView(view);
                if (data) setSelectedProduct(data);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 4000);
            };

            const addToCart = (product, qty = 1, size = 'M') => {
                setCart(prev => {
                const existing = prev.find(item => item.id === product.id && item.size === size);
                if (existing) {
                    return prev.map(item => item.id === product.id && item.size === size ? { ...item, qty: item.qty + qty } : item);
                }
                return [...prev, { ...product, qty, size }];
                });
                setIsCartOpen(true);
            };

            const toggleWishlist = (product) => {
                setWishlist(prev => {
                const exists = prev.find(item => item.id === product.id);
                if (exists) {
                    showToast("Dihapus dari daftar keinginan");
                    return prev.filter(item => item.id !== product.id);
                }
                showToast("Tersimpan di daftar keinginan Anda");
                return [...prev, product];
                });
            };

            return (
                <div className="relative min-h-screen flex flex-col selection:bg-[#9A7B4F] selection:text-white">
                <GlobalStyles />
                
                <Navbar 
                    cartCount={cart.reduce((acc, item) => acc + item.qty, 0)} 
                    wishlistCount={wishlist.length}
                    onOpenCart={() => setIsCartOpen(true)}
                    onNavigate={navigate}
                    currentView={currentView}
                />

                <main className="flex-grow">
                    {currentView === 'home' && <HomeView onNavigate={navigate} onToggleWishlist={toggleWishlist} wishlist={wishlist} />}
                    {currentView === 'shop' && <ShopView onNavigate={navigate} onToggleWishlist={toggleWishlist} wishlist={wishlist} />}
                    {currentView === 'product' && <ProductDetailView product={selectedProduct} onAddToCart={addToCart} onNavigate={navigate} />}
                    {currentView === 'checkout' && <CheckoutView cart={cart} setCart={setCart} onNavigate={navigate} />}
                </main>

                {currentView !== 'checkout' && <Footer />}

                <CartDrawer 
                    isOpen={isCartOpen} 
                    onClose={() => setIsCartOpen(false)} 
                    cart={cart} 
                    setCart={setCart}
                    onCheckout={() => { setIsCartOpen(false); navigate('checkout'); }}
                />
                
                {toast && <Toast message={toast} />}
                </div>
            );
        }

                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const isHomeTop = currentView === 'home' && !scrolled;

            return (
                <React.Fragment>
                <header className={`fixed top-0 w-full z-40 transition-all duration-700 ${scrolled || currentView !== 'home' ? 'bg-[#FAF9F6]/95 backdrop-blur-md border-b border-[#E2DCD0] py-4 shadow-sm' : 'bg-transparent py-8'}`}>

                    <div

                        <button onClick={() => setMobileMenu(false)}><X className="w-6 h-6 stroke-1" /></button>

                        <button onClick={() => { setMobileMenu(false); onNavigate('shop'); }} className="text-left font-light hover:text-[#9A7B4F] transition-colors">Koleksi Terbaru</button>
                        <button onClick={() => { setMobileMenu(false); onNavigate('shop'); }} className="text-left font-light hover:text-[#9A7B4F] transition-colors">Pakaian Pria & Wanita</button>
