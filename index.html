<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS SYSTEM ---
        const IconBase = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const ShoppingBag = ({className}) => <IconBase className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></IconBase>;
        const Heart = ({className}) => <IconBase className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></IconBase>;
        const Search = ({className}) => <IconBase className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconBase>;
        const Menu = ({className}) => <IconBase className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>;
        const X = ({className}) => <IconBase className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const ChevronRight = ({className}) => <IconBase className={className}><path d="m9 18 6-6-6-6"/></IconBase>;
        const ChevronDown = ({className}) => <IconBase className={className}><path d="m6 9 6 6 6-6"/></IconBase>;
        const ArrowRight = ({className}) => <IconBase className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
        const ArrowLeft = ({className}) => <IconBase className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></IconBase>;
        const Truck = ({className}) => <IconBase className={className}><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></IconBase>;
        const Shield = ({className}) => <IconBase className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></IconBase>;

        // --- THEME CONFIGURATION ---
        const THEME = {
            colors: {
                bg: '#F9F8F6', 
                text: '#0A0A0A', 
                accent: '#C5A059', 
                border: '#EAE6DF'
            }
        };

        const formatIDR = (price) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(price);
        };

        // --- DATA PRODUK REALISTIS TERINTEGRASI ---
        const fetchProductsAPI = () => {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve([
                        { 
                            id: 1, name: "Lavender Power Suit", price: 115000000, category: "Complete Look", color: "Lavender & Putih", isNew: true,
                            images: ["https://i.ibb.co.com/BVPRZkwv/7f5465d0143fe8187c3e53ec0ad8c58d.jpg"],
                            desc: "Interpretasi modern dari power dressing. Setelan palazzo vest lavender dipadukan sempurna dengan kemeja slim-fit dan keanggunan tas ikonik Lady Dior ungu. Tampilan berwibawa untuk wanita eksekutif masa kini.",
                            items: [
                                { name: "Lavender Vest Suit Set (Palazzo + Vest)", priceUSD: "~$150" },
                                { name: "White Button-Down Shirt (Slim-fit)", priceUSD: "~$60" },
                                { name: "Dior Lady Dior Bag (Purple Cannage)", priceUSD: "$6,800" },
                                { name: "Purple Patent Stiletto Heels", priceUSD: "~$200" }
                            ]
                        },
                        { 
                            id: 2, name: "Blue Stripe Corporate Chic", price: 94500000, category: "Complete Look", color: "Biru Stripe & Hitam", isBest: true,
                            images: ["https://i.ibb.co.com/1JtSYxth/0019b1418ef245b469e470879a56a25c.jpg"],
                            desc: "Keseimbangan antara gaya korporat dan sentuhan desainer. Kemeja silk-like dipasangkan dengan celana wide-leg dan disempurnakan oleh mahakarya Miu Miu Wander Hobo.",
                            items: [
                                { name: "Blue Striped Oversized Shirt (Silk-like)", priceUSD: "~$600" },
                                { name: "Black Wide-Leg Trousers", priceUSD: "~$300" },
                                { name: "Miu Miu Wander Hobo Bag (Black Matelassé)", priceUSD: "$3,125" },
                                { name: "YSL Opyum Sandals (Black Patent)", priceUSD: "$1,295" },
                                { name: "Gold Watch & Hoop Earrings", priceUSD: "~$600" }
                            ]
                        },
                        { 
                            id: 3, name: "Soft Pink Feminine", price: 125500000, category: "Complete Look", color: "Baby Pink & Putih",
                            images: ["https://i.ibb.co.com/HLscmMKQ/91eea0ec3ad618d4981e0a8f6b7bf28a.jpg"],
                            desc: "Estetika Parisian chic yang feminin. Paduan tweed houndstooth pink-putih, blouse berkerah lebar, serta Lady Dior berwarna baby pink yang klasik dan manis.",
                            items: [
                                { name: "Pink Houndstooth Crop Vest (Tweed)", priceUSD: "~$150" },
                                { name: "White Puff Sleeve Blouse", priceUSD: "~$100" },
                                { name: "White Wide-Leg Trousers", priceUSD: "~$200" },
                                { name: "Dior Lady Dior Bag (Baby Pink Lambskin)", priceUSD: "$6,500" },
                                { name: "Miu Miu Pink Stiletto Pumps", priceUSD: "$900" }
                            ]
                        },
                        { 
                            id: 4, name: "Black & Ivory Cape Drama", price: 43500000, category: "Complete Look", color: "Hitam & Krem", isLimited: true,
                            images: ["https://i.ibb.co.com/wZp8MCVf/e91d3f01fdaafd4107434bdf8062c923.jpg"],
                            desc: "Siluet dramatis dengan cape blazer hitam terstruktur menutupi ivory belted wrap dress. Sepatu boots setinggi lutut menambah sentuhan edgy dan dominan.",
                            items: [
                                { name: "Black Cape Blazer (Structured lapel)", priceUSD: "~$600" },
                                { name: "Ivory Belted Wrap Dress (Gold buckle)", priceUSD: "~$400" },
                                { name: "Off-White Leather Hobo Bag", priceUSD: "~$600" },
                                { name: "Black Knee-High Leather Boots", priceUSD: "~$800" },
                                { name: "Gold Drop Earrings & Watch", priceUSD: "~$300" }
                            ]
                        },
                        { 
                            id: 5, name: "Burgundy Elegance", price: 196500000, category: "Complete Look", color: "Burgundy & Ivory",
                            images: ["https://i.ibb.co.com/qL196kNS/5d6b1e8868684d0ecf5466d0e7b757b2.jpg"],
                            desc: "Kemewahan sejati dengan rok midi draping dramatis warna burgundy, dikombinasikan blus sutra V-neck. Bintang utama look ini adalah Chanel Classic Flap berlapis kulit burgundy quilted.",
                            items: [
                                { name: "Ivory Silk Blouse (V-neck wrap)", priceUSD: "~$200" },
                                { name: "Burgundy Ruffle Wrap Skirt", priceUSD: "~$180" },
                                { name: "Chanel Classic Flap Bag (Burgundy)", priceUSD: "$11,300" },
                                { name: "Cream Block Heel Ankle Boots", priceUSD: "~$200" },
                                { name: "Gold Chain Earrings & Rose Gold Watch", priceUSD: "~$400" }
                            ]
                        },
                        { 
                            id: 6, name: "All Burgundy Monochrome", price: 29500000, category: "Complete Look", color: "Solid Burgundy",
                            images: ["https://i.ibb.co.com/4wcJ8jK4/6ec67d9a81cb038b379c980ee2371255.jpg"],
                            desc: "Penampilan monokromatik berani yang menciptakan ilusi tinggi dan siluet merampingkan. Mantel wol panjang dipadukan celana palazzo senada dengan tas kulit hitam solid.",
                            items: [
                                { name: "Burgundy Long Wool Coat", priceUSD: "~$600" },
                                { name: "Burgundy Ribbed Turtleneck", priceUSD: "~$150" },
                                { name: "Burgundy Wide-Leg Pants", priceUSD: "~$200" },
                                { name: "Coach Teri Shoulder Bag (Black Pebble)", priceUSD: "$398" },
                                { name: "Gold Belt Clasps & Black Ankle Boots", priceUSD: "~$500" }
                            ]
                        },
                        { 
                            id: 7, name: "All Black Luxe Minimal", price: 177500000, category: "Complete Look", color: "Hitam Solid", isBest: true,
                            images: ["https://i.ibb.co.com/NnrRPXbc/16955750f4c47812bb69e0b018a1cbc8.jpg"],
                            desc: "Adibusana minimalis. Wrap blazer hitam pahatan membalut tubuh secara natural, diaksentuasi keanggunan tas tenun Bottega Veneta Andiamo dan stiletto YSL Opyum.",
                            items: [
                                { name: "Black Wrap Sculptural Blazer", priceUSD: "~$500" },
                                { name: "Black Wide-Leg Premium Trousers", priceUSD: "~$300" },
                                { name: "Bottega Veneta Andiamo Bag (Black)", priceUSD: "$8,400" },
                                { name: "YSL Opyum Sandals (Black Patent)", priceUSD: "$1,295" },
                                { name: "Gold Rectangular Watch", priceUSD: "~$600" }
                            ]
                        },
                        { 
                            id: 8, name: "Casual Blue Minimal", price: 166000000, category: "Complete Look", color: "Denim Biru & Putih",
                            images: ["https://i.ibb.co.com/67Fhp6Ht/c74ec96456d11b0b3985dd95c2439aa5.jpg"],
                            desc: "Kemewahan kasual akhir pekan. Paduan kemeja loose stripe dan wide-leg jeans yang diperkaya kilau jam Cartier Panthère mewah serta kalung perak.",
                            items: [
                                { name: "Blue Stripe Oversized Shirt", priceUSD: "~$80" },
                                { name: "Blue Wide-Leg Denim Jeans", priceUSD: "~$150" },
                                { name: "White Leather Shoulder Bag", priceUSD: "~$300" },
                                { name: "Cartier Panthère Watch (Steel & 18K Gold)", priceUSD: "$9,000" },
                                { name: "Nike AF1, Crop Top, Accessories & Silk Scarf", priceUSD: "~$850" }
                            ]
                        }
                    ]);
                }, 1000); 
            });
        };

        // --- GLOBAL STYLES ---
        const GlobalStyles = () => (
            <style>{`
                :root {
                    --font-serif: 'Cormorant Garamond', serif; 
                    --font-sans: 'Montserrat', sans-serif; 
                }
                body {
                    font-family: var(--font-sans);
                    background-color: ${THEME.colors.bg};
                    color: ${THEME.colors.text};
                    overflow-x: hidden;
                    -webkit-font-smoothing: antialiased;
                }
                h1, h2, h3, h4, .font-serif { font-family: var(--font-serif); }
                
                @keyframes fadeUp {
                    from { opacity: 0; transform: translateY(20px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-up { animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
                
                @keyframes pulse-elegant {
                    0%, 100% { opacity: 1; }
                    50% { opacity: 0.5; }
                }
                .animate-pulse-elegant { animation: pulse-elegant 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

                @keyframes toast-slide {
                    0% { transform: translate(-50%, 100%); opacity: 0; }
                    10%, 90% { transform: translate(-50%, 0); opacity: 1; }
                    100% { transform: translate(-50%, 100%); opacity: 0; }
                }
                .animate-toast { animation: toast-slide 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

                ::-webkit-scrollbar { width: 4px; }
                ::-webkit-scrollbar-track { background: ${THEME.colors.bg}; }
                ::-webkit-scrollbar-thumb { background: #D0C9C0; }
                ::-webkit-scrollbar-thumb:hover { background: ${THEME.colors.accent}; }

                .link-hover { position: relative; padding-bottom: 2px; }
                .link-hover::after {
                    content: ''; position: absolute; width: 100%; height: 1px;
                    bottom: 0; left: 0; background-color: currentColor;
                    transform: scaleX(0); transform-origin: right; transition: transform 0.5s ease;
                }
                .link-hover:hover::after { transform: scaleX(1); transform-origin: left; }
                
                .image-zoom-hover img { transition: transform 2s cubic-bezier(0.16, 1, 0.3, 1); }
                .image-zoom-hover:hover img { transform: scale(1.06); }
            `}</style>
        );

        // --- LUXURY IMAGE FALLBACK ---
        const LuxuryImage = ({ src, alt, className }) => {
            const [isLoaded, setIsLoaded] = useState(false);
            const [hasError, setHasError] = useState(false);
            
            const fallbackSrc = "https://images.unsplash.com/photo-1600607686527-6fb886090705?q=80&w=800&auto=format&fit=crop";

            return (
                <div className={`relative overflow-hidden bg-[#F0EBE1] ${className}`}>
                    {!isLoaded && !hasError && (
                        <div className="absolute inset-0 animate-pulse-elegant bg-[#EAE6DF]"></div>
                    )}
                    <img 
                        src={hasError ? fallbackSrc : src} 
                        alt={alt}
                        onLoad={() => setIsLoaded(true)}
                        onError={() => setHasError(true)}
                        className={`w-full h-full object-cover transition-opacity duration-1000 ${isLoaded ? 'opacity-100' : 'opacity-0'}`}
                        loading="lazy"
                    />
                </div>
            );
        };

        // --- TOAST COMPONENT ---
        const Toast = ({ message }) => (
            <div className="fixed bottom-8 left-1/2 z-50 animate-toast pointer-events-none">
                <div className="bg-[#0A0A0A] text-white px-8 py-4 flex items-center gap-3 shadow-xl border border-white/10">
                    <span className="text-[10px] uppercase tracking-[0.2em] font-medium">{message}</span>
                </div>
            </div>
        );

        // --- MAIN APP ---
        function App() {
            const [currentView, setCurrentView] = useState('home'); 
            const [products, setProducts] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [cart, setCart] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [toast, setToast] = useState(null);

            useEffect(() => {
                const loadData = async () => {
                    setIsLoading(true);
                    try {
                        const data = await fetchProductsAPI();
                        setProducts(data);
                    } catch (error) {
                        console.error("Gagal memuat data produk", error);
                    } finally {
                        setIsLoading(false);
                    }
                };
                loadData();
            }, []);

            const navigate = (view, data = null) => {
                setCurrentView(view);
                if (data) setSelectedProduct(data);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3500);
            };

            const addToCart = (product, qty = 1, size = 'Lengkap') => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id && item.size === size);
                    if (existing) {
                        return prev.map(item => item.id === product.id && item.size === size ? { ...item, qty: item.qty + qty } : item);
                    }
                    return [...prev, { ...product, qty, size }];
                });
                setIsCartOpen(true);
            };

            const toggleWishlist = (product) => {
                setWishlist(prev => {
                    const exists = prev.find(item => item.id === product.id);
                    if (exists) {
                        showToast("Dihapus dari daftar simpanan");
                        return prev.filter(item => item.id !== product.id);
                    }
                    showToast("Ditambahkan ke koleksi wishlist Anda");
                    return [...prev, product];
                });
            };

            if (isLoading) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-[#F9F8F6]">
                        <h1 className="text-3xl font-serif tracking-[0.3em] text-[#0A0A0A] mb-4 animate-pulse-elegant uppercase">MEGA LUXURY</h1>
                        <div className="w-24 h-[1px] bg-[#C5A059] overflow-hidden relative">
                            <div className="absolute top-0 left-0 h-full w-full bg-[#0A0A0A] animate-[translate_1.5s_infinite]"></div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative min-h-screen flex flex-col text-[#0A0A0A] selection:bg-[#C5A059] selection:text-white bg-[#F9F8F6]">
                    <GlobalStyles />
                    
                    <Navbar 
                        cartCount={cart.reduce((acc, item) => acc + item.qty, 0)} 
                        wishlistCount={wishlist.length}
                        onOpenCart={() => setIsCartOpen(true)}
                        onNavigate={navigate}
                        currentView={currentView}
                    />

                    <main className="flex-grow">
                        {currentView === 'home' && <HomeView products={products} onNavigate={navigate} onToggleWishlist={toggleWishlist} wishlist={wishlist} />}
                        {currentView === 'shop' && <ShopView products={products} onNavigate={navigate} onToggleWishlist={toggleWishlist} wishlist={wishlist} />}
                        {currentView === 'product' && <ProductDetailView product={selectedProduct} onAddToCart={addToCart} onNavigate={navigate} />}
                        {currentView === 'checkout' && <CheckoutView cart={cart} setCart={setCart} onNavigate={navigate} />}
                    </main>

                    {currentView !== 'checkout' && <Footer />}

                    <CartDrawer 
                        isOpen={isCartOpen} 
                        onClose={() => setIsCartOpen(false)} 
                        cart={cart} 
                        setCart={setCart}
                        onCheckout={() => { setIsCartOpen(false); navigate('checkout'); }}
                    />
                    
                    {toast && <Toast message={toast} />}
                </div>
            );
        }

        const Navbar = ({ cartCount, wishlistCount, onOpenCart, onNavigate, currentView }) => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenu, setMobileMenu] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const isSolid = scrolled || currentView !== 'home';

            return (
                <React.Fragment>
                <header className={`fixed top-0 w-full z-40 transition-all duration-700 ${isSolid ? 'bg-[#F9F8F6]/90 backdrop-blur-md border-b border-[#EAE6DF] py-4' : 'bg-transparent py-8'}`}>
                    <div className="max-w-[1440px] mx-auto px-6 lg:px-12 flex justify-between items-center">
                    
                        <button className={`md:hidden ${isSolid ? 'text-[#0A0A0A]' : 'text-white drop-shadow-md'}`} onClick={() => setMobileMenu(true)}>
                            <Menu className="w-6 h-6 stroke-[1]" />
                        </button>

                        <nav className={`hidden md:flex space-x-10 text-[10px] tracking-[0.25em] uppercase font-medium ${isSolid ? 'text-[#0A0A0A]' : 'text-white drop-shadow-md'}`}>
                            <button onClick={() => onNavigate('shop')} className="link-hover">Koleksi</button>
                            <button onClick={() => onNavigate('shop')} className="link-hover">Atelier</button>
                        </nav>

                        <div 
                            className={`absolute left-1/2 transform -translate-x-1/2 text-center cursor-pointer transition-colors duration-700 ${isSolid ? 'text-[#0A0A0A]' : 'text-white drop-shadow-md'}`}
                            onClick={() => onNavigate('home')}
                        >
                            <h1 className="text-2xl lg:text-3xl font-serif tracking-[0.25em] uppercase leading-none">MEGA LUXURY</h1>
                        </div>

                        <div className={`flex items-center space-x-6 ${isSolid ? 'text-[#0A0A0A]' : 'text-white drop-shadow-md'}`}>
                            <button className="hidden sm:block hover:text-[#C5A059] transition-colors"><Search className="w-5 h-5" /></button>
                            <button className="relative hover:text-[#C5A059] transition-colors hidden sm:block">
                                <Heart className="w-5 h-5" />
                                {wishlistCount > 0 && <span className="absolute -top-1 -right-1 bg-[#C5A059] text-white text-[8px] font-medium w-3.5 h-3.5 flex items-center justify-center rounded-full">{wishlistCount}</span>}
                            </button>
                            <button className="relative hover:text-[#C5A059] transition-colors" onClick={onOpenCart}>
                                <ShoppingBag className="w-5 h-5" />
                                {cartCount > 0 && <span className="absolute -top-1 -right-1 bg-[#C5A059] text-white text-[8px] font-medium w-3.5 h-3.5 flex items-center justify-center rounded-full">{cartCount}</span>}
                            </button>
                        </div>
                    </div>
                </header>

                <div className={`fixed inset-0 z-50 bg-[#F9F8F6] text-[#0A0A0A] flex flex-col p-8 transition-transform duration-700 ${mobileMenu ? 'translate-y-0' : '-translate-y-full'}`}>
                    <div className="flex justify-between items-center mb-16 pb-6 border-b border-[#EAE6DF]">
                        <span className="font-serif text-2xl uppercase tracking-[0.2em]">MEGA LUXURY</span>
                        <button onClick={() => setMobileMenu(false)}><X className="w-6 h-6 stroke-1" /></button>
                    </div>
                    <nav className="flex flex-col space-y-8 text-3xl font-serif text-[#0A0A0A]">
                        <button onClick={() => { setMobileMenu(false); onNavigate('home'); }} className="text-left font-light hover:text-[#C5A059] transition-colors">Beranda</button>
                        <button onClick={() => { setMobileMenu(false); onNavigate('shop'); }} className="text-left font-light hover:text-[#C5A059] transition-colors">Semua Koleksi</button>
                        <button onClick={() => { setMobileMenu(false); onNavigate('shop'); }} className="text-left font-light hover:text-[#C5A059] transition-colors">Atelier Service</button>
                    </nav>
                </div>
                </React.Fragment>
            );
        };

        const HeroSection = ({ onNavigate }) => {
            return (
                <div className="relative h-screen w-full flex items-center justify-center overflow-hidden bg-[#0A0A0A]">
                    <div className="absolute inset-0 w-full h-full opacity-70">
                        <img 
                            src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=2070&auto=format&fit=crop" 
                            alt="Luxury Fashion Campaign" 
                            className="w-full h-full object-cover object-top animate-[imageReveal_2s_ease-out_forwards]"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0A0A0A] via-transparent to-[#0A0A0A]/30 opacity-90" />
                    </div>

                    <div className="relative z-10 text-center px-6 flex flex-col items-center w-full mt-20 animate-fade-up">
                        <h2 className="text-[#F9F8F6] text-[9px] md:text-[10px] tracking-[0.5em] font-medium uppercase mb-6 opacity-90">
                            The Elite Selection 2025
                        </h2>
                        
                        <h1 className="text-5xl md:text-7xl lg:text-8xl font-serif text-white mb-10 leading-tight">
                            Siluet <br/> <span className="italic text-[#C5A059] font-light">Eksklusivitas</span>
                        </h1>
                        
                        <button 
                            onClick={() => onNavigate('shop')}
                            className="group flex items-center justify-center text-white pb-2 border-b border-white/50 hover:text-[#C5A059] hover:border-[#C5A059] transition-all duration-500"
                        >
                            <span className="text-[10px] tracking-[0.25em] uppercase font-medium">Temukan Mahakarya</span>
                            <ArrowRight className="w-4 h-4 ml-4 group-hover:translate-x-2 transition-transform" />
                        </button>
                    </div>
                </div>
            );
        };

        const ProductCard = ({ product, onNavigate, onToggleWishlist, isWishlisted }) => {
            return (
                <div className="group cursor-pointer flex flex-col bg-transparent">
                    <div className="relative aspect-[3/4] mb-5 image-zoom-hover">
                        <LuxuryImage 
                            src={product.images[0]} 
                            alt={product.name} 
                            className="absolute inset-0 w-full h-full"
                        />
                        
                        <div className="absolute top-4 left-4 flex flex-col gap-2 z-10">
                            {product.isNew && <span className="bg-white/90 backdrop-blur-sm text-[#0A0A0A] text-[8px] font-semibold uppercase tracking-[0.2em] px-3 py-1">Baru</span>}
                            {product.isBest && <span className="bg-[#C5A059] text-white text-[8px] font-semibold uppercase tracking-[0.2em] px-3 py-1">Ikonik</span>}
                            {product.isLimited && <span className="bg-[#0A0A0A] text-white text-[8px] font-semibold uppercase tracking-[0.2em] px-3 py-1">Limited</span>}
                        </div>

                        <button 
                            onClick={(e) => { e.stopPropagation(); onToggleWishlist(product); }}
                            className="absolute bottom-4 right-4 p-3 bg-white/90 hover:bg-white backdrop-blur-md rounded-full text-[#0A0A0A] transition-all duration-500 z-10 opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0"
                        >
                            <Heart className={`w-4 h-4 ${isWishlisted ? 'fill-[#C5A059] text-[#C5A059]' : ''}`} />
                        </button>
                    </div>

                    <div className="flex flex-col text-center px-2">
                        <h3 className="font-serif text-xl font-medium text-[#0A0A0A] mb-1 group-hover:text-[#C5A059] transition-colors truncate">{product.name}</h3>
                        <p className="text-[9px] uppercase tracking-[0.2em] text-[#888888] mb-3">{product.category}</p>
                        <span className="font-sans text-sm font-medium tracking-wide text-[#0A0A0A]">{formatIDR(product.price)}</span>
                    </div>
                </div>
            );
        };

        const HomeView = ({ products, onNavigate, onToggleWishlist, wishlist }) => (
            <div className="animate-fade-up bg-[#F9F8F6]">
                <HeroSection onNavigate={onNavigate} />
                
                <section className="py-32 px-6 lg:px-12 max-w-[1440px] mx-auto">
                    <div className="flex flex-col items-center mb-20 text-center">
                        <span className="text-[9px] text-[#C5A059] uppercase tracking-[0.3em] font-medium mb-4">Pilihan Terkurasi</span>
                        <h2 className="text-4xl md:text-5xl font-serif text-[#0A0A0A]">Koleksi Utama</h2>
                    </div>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-16">
                        {products.slice(0, 4).map(product => (
                            <ProductCard 
                                key={product.id}
                                product={product} 
                                onNavigate={onNavigate}
                                onToggleWishlist={onToggleWishlist}
                                isWishlisted={wishlist.some(w => w.id === product.id)}
                            />
                        ))}
                    </div>
                    
                    <div className="flex justify-center mt-24">
                        <button onClick={() => onNavigate('shop')} className="px-12 py-5 border border-[#0A0A0A] text-[10px] uppercase tracking-[0.25em] font-semibold text-[#0A0A0A] hover:bg-[#0A0A0A] hover:text-white transition-all duration-500">
                            Eksplorasi Seluruh Koleksi
                        </button>
                    </div>
                </section>
            </div>
        );

        const ShopView = ({ products, onNavigate, onToggleWishlist, wishlist }) => {
            return (
                <div className="pt-40 pb-32 px-6 lg:px-12 max-w-[1440px] mx-auto animate-fade-up">
                    <div className="flex flex-col items-center mb-20 text-center border-b border-[#EAE6DF] pb-16">
                        <h1 className="text-5xl font-serif text-[#0A0A0A] mb-6">Katalog Butik</h1>
                        <p className="text-[13px] text-[#555555] font-light max-w-xl mx-auto leading-relaxed">Pilihan mahakarya abadi (Satu Set Penampilan Penuh / *Complete Look*) yang dirancang secara eksklusif untuk menyempurnakan portofolio gaya Anda.</p>
                        
                        <div className="mt-12 text-[10px] font-medium tracking-[0.2em] uppercase text-[#0A0A0A]">
                            <span>{products.length} Tampilan Terkurasi</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-16">
                        {products.map(product => (
                            <ProductCard 
                                key={product.id}
                                product={product} 
                                onNavigate={onNavigate}
                                onToggleWishlist={onToggleWishlist}
                                isWishlisted={wishlist.some(w => w.id === product.id)}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const ProductDetailView = ({ product, onAddToCart, onNavigate }) => {
            const [activeImage, setActiveImage] = useState(0);
            const [selectedSize, setSelectedSize] = useState('S/M (Standard)');
            const sizes = ['Petite', 'S/M (Standard)', 'L/XL (Curved)'];

            if (!product) return null;

            return (
                <div className="pt-32 pb-24 px-6 lg:px-12 max-w-[1440px] mx-auto animate-fade-up bg-[#F9F8F6]">
                    <div className="flex items-center space-x-3 text-[9px] font-semibold uppercase tracking-[0.25em] mb-12 text-[#888888]">
                        <button onClick={() => onNavigate('home')} className="hover:text-[#0A0A0A] transition-colors">Beranda</button>
                        <span>—</span>
                        <button onClick={() => onNavigate('shop')} className="hover:text-[#0A0A0A] transition-colors">Katalog</button>
                        <span>—</span>
                        <span className="text-[#0A0A0A]">{product.name}</span>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-16">
                        <div className="w-full lg:w-7/12 flex gap-4">
                            {product.images.length > 1 && (
                                <div className="hidden md:flex flex-col gap-4 w-24">
                                    {product.images.map((img, idx) => (
                                        <div 
                                            key={idx}
                                            onClick={() => setActiveImage(idx)}
                                            className={`w-full aspect-[3/4] cursor-pointer overflow-hidden transition-all duration-300 ${activeImage === idx ? 'opacity-100 ring-1 ring-[#0A0A0A]' : 'opacity-50 hover:opacity-100'}`}
                                        >
                                            <LuxuryImage src={img} alt="thumb" className="w-full h-full" />
                                        </div>
                                    ))}
                                </div>
                            )}
                            
                            <div className="flex-1 relative aspect-[3/4] md:h-[85vh]">
                                <LuxuryImage src={product.images[activeImage]} alt={product.name} className="w-full h-full absolute inset-0" />
                            </div>
                        </div>

                        <div className="w-full lg:w-5/12 flex flex-col pt-4">
                            <div className="mb-10">
                                <p className="text-[10px] text-[#C5A059] uppercase tracking-[0.25em] font-semibold mb-4">{product.category}</p>
                                <h1 className="text-4xl md:text-5xl font-serif text-[#0A0A0A] mb-4 leading-tight">{product.name}</h1>
                                <p className="text-xl font-medium tracking-wide text-[#0A0A0A]">{formatIDR(product.price)}</p>
                            </div>

                            <p className="text-[#555555] mb-10 font-light leading-relaxed text-[13px] text-justify">{product.desc}</p>

                            {product.items && (
                                <div className="mb-10 bg-white p-6 border border-[#EAE6DF]">
                                    <h3 className="text-[10px] uppercase tracking-[0.2em] font-semibold text-[#0A0A0A] mb-4 border-b border-[#EAE6DF] pb-3">Rincian Komponen Look (Referensi Retail):</h3>
                                    <ul className="space-y-3">
                                        {product.items.map((item, idx) => (
                                            <li key={idx} className="flex justify-between items-center text-[11.5px]">
                                                <span className="text-[#555555] font-light max-w-[70%]">{item.name}</span>
                                                <span className="text-[#0A0A0A] font-medium">{item.priceUSD}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}

                            <div className="mb-10">
                                <span className="text-[9px] uppercase font-semibold tracking-[0.2em] text-[#888888] mb-3 block">
                                    Tema Warna: <span className="text-[#0A0A0A] ml-1">{product.color}</span>
                                </span>
                            </div>

                            <div className="mb-12">
                                <div className="flex justify-between items-center mb-4">
                                    <span className="text-[9px] uppercase font-semibold tracking-[0.2em] text-[#888888]">Pilih Ukuran Fitting Setelan</span>
                                    <button className="text-[9px] uppercase font-medium tracking-[0.1em] text-[#0A0A0A] link-hover">Atelier Fitting</button>
                                </div>
                                <div className="flex flex-wrap gap-3">
                                    {sizes.map(size => (
                                        <button 
                                            key={size}
                                            onClick={() => setSelectedSize(size)}
                                            className={`px-6 h-12 flex items-center justify-center text-[11px] font-medium transition-all duration-300 border ${selectedSize === size ? 'bg-[#0A0A0A] text-white border-[#0A0A0A]' : 'bg-transparent text-[#0A0A0A] border-[#EAE6DF] hover:border-[#0A0A0A]'}`}
                                        >
                                            {size}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button 
                                onClick={() => onAddToCart(product, 1, selectedSize)}
                                className="w-full bg-[#0A0A0A] text-white py-5 text-[10px] font-semibold tracking-[0.25em] uppercase hover:bg-[#C5A059] transition-colors duration-500 mb-8"
                            >
                                Pesan Koleksi Ini (Satu Set)
                            </button>

                            <div className="space-y-4 pt-8 border-t border-[#EAE6DF]">
                                <div className="flex items-center text-[11px] text-[#555555] font-light">
                                    <Truck className="w-4 h-4 mr-4 text-[#C5A059]" /> Kurir Keamanan VIP Khusus (Armor Truck)
                                </div>
                                <div className="flex items-center text-[11px] text-[#555555] font-light">
                                    <Shield className="w-4 h-4 mr-4 text-[#C5A059]" /> Sertifikat Autentikasi Global Untuk Tas Luxury
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const CartDrawer = ({ isOpen, onClose, cart, setCart, onCheckout }) => {
            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const updateQty = (id, size, delta) => setCart(prev => prev.map(item => item.id === id && item.size === size ? { ...item, qty: Math.max(1, item.qty + delta) } : item));
            const removeItem = (id, size) => setCart(prev => prev.filter(item => !(item.id === id && item.size === size)));

            return (
                <React.Fragment>
                <div className={`fixed inset-0 bg-[#0A0A0A]/30 backdrop-blur-sm z-50 transition-opacity duration-700 ${isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={onClose} />
                
                <div className={`fixed top-0 right-0 h-full w-full sm:w-[480px] bg-[#F9F8F6] z-50 transform transition-transform duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] shadow-2xl flex flex-col ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                    <div className="px-10 py-10 flex justify-between items-center border-b border-[#EAE6DF]">
                        <h2 className="font-serif text-3xl text-[#0A0A0A]">Tas Belanja</h2>
                        <button onClick={onClose} className="hover:rotate-90 transition-transform duration-500 text-[#0A0A0A]"><X className="w-6 h-6 stroke-1" /></button>
                    </div>

                    <div className="flex-1 overflow-y-auto px-10 py-8 space-y-8">
                        {cart.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-[#888888] space-y-5">
                                <p className="uppercase tracking-[0.2em] font-medium text-[10px]">Tas Belanja Kosong</p>
                                <button onClick={onClose} className="link-hover text-[#0A0A0A] uppercase tracking-widest text-[9px] mt-2">Lanjutkan Eksplorasi</button>
                            </div>
                        ) : (
                            cart.map((item, idx) => (
                                <div key={idx} className="flex gap-6 relative">
                                    <div className="w-24 aspect-[3/4]">
                                        <LuxuryImage src={item.images[0]} alt={item.name} className="w-full h-full" />
                                    </div>
                                    <div className="flex-1 flex flex-col justify-center py-2">
                                        <h3 className="font-serif text-lg font-medium text-[#0A0A0A] pr-6 truncate">{item.name}</h3>
                                        <p className="text-[9px] text-[#888888] mt-2 font-medium uppercase tracking-widest">Set {item.size}</p>
                                        <span className="font-medium text-[13px] tracking-wide text-[#0A0A0A] mt-3">{formatIDR(item.price)}</span>
                                        <div className="flex items-center gap-4 mt-4">
                                            <button onClick={() => updateQty(item.id, item.size, -1)} className="text-[#888888] hover:text-[#0A0A0A]">-</button>
                                            <span className="text-[11px] font-medium text-[#0A0A0A]">{item.qty}</span>
                                            <button onClick={() => updateQty(item.id, item.size, 1)} className="text-[#888888] hover:text-[#0A0A0A]">+</button>
                                        </div>
                                    </div>
                                    <button onClick={() => removeItem(item.id, item.size)} className="absolute top-2 right-0 text-[#888888] hover:text-[#C5A059]"><X className="w-4 h-4" /></button>
                                </div>
                            ))
                        )}
                    </div>

                    {cart.length > 0 && (
                        <div className="p-10 bg-white border-t border-[#EAE6DF]">
                            <div className="flex justify-between items-center mb-8 text-[#0A0A0A]">
                                <span className="font-serif text-xl">Subtotal</span>
                                <span className="font-medium tracking-wide">{formatIDR(subtotal)}</span>
                            </div>
                            <button onClick={onCheckout} className="w-full bg-[#0A0A0A] text-white py-5 font-semibold uppercase tracking-[0.25em] text-[10px] hover:bg-[#C5A059] transition-colors duration-500">
                                Lanjut Ke Pembayaran
                            </button>
                        </div>
                    )}
                </div>
                </React.Fragment>
            );
        };

        const CheckoutView = ({ cart, setCart, onNavigate }) => {
            if (cart.length === 0) {
                return (
                    <div className="min-h-screen pt-40 flex flex-col items-center bg-[#F9F8F6]">
                        <p className="uppercase font-medium tracking-widest text-[#888888] text-sm">Sesi telah berakhir.</p>
                        <button onClick={() => onNavigate('shop')} className="mt-6 link-hover text-[#0A0A0A] uppercase tracking-widest text-[10px]">Kembali ke Butik</button>
                    </div>
                );
            }

            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

            return (
                <div className="min-h-screen bg-[#F9F8F6] pt-40 pb-32 animate-fade-up">
                    <div className="max-w-4xl mx-auto px-6 lg:px-12 text-center">
                        <h1 className="text-4xl font-serif text-[#0A0A0A] mb-4">Checkout Eksklusif</h1>
                        <p className="text-[10px] uppercase tracking-[0.2em] font-medium text-[#C5A059] mb-16">Koneksi Terenkripsi Aman 100%</p>

                        <div className="bg-white p-10 border border-[#EAE6DF] shadow-sm text-left">
                            <h2 className="font-serif text-2xl mb-8 border-b border-[#EAE6DF] pb-4">Ringkasan Pesanan (Full Look Set)</h2>
                            <div className="space-y-6 mb-8">
                                {cart.map((item, i) => (
                                    <div key={i} className="flex justify-between items-center">
                                        <div className="flex items-center gap-4">
                                            <div className="w-16 h-20">
                                                <LuxuryImage src={item.images[0]} alt={item.name} className="w-full h-full" />
                                            </div>
                                            <div>
                                                <p className="font-serif text-lg text-[#0A0A0A]">{item.name}</p>
                                                <p className="text-[9px] font-medium text-[#888888] uppercase tracking-widest mt-1">Set {item.size} / Qty: {item.qty}</p>
                                            </div>
                                        </div>
                                        <span className="text-[13px] font-medium text-[#0A0A0A]">{formatIDR(item.price * item.qty)}</span>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="border-t border-[#EAE6DF] mt-8 pt-8 flex justify-between items-center">
                                <span className="font-serif text-2xl text-[#0A0A0A]">Total Pembayaran</span>
                                <span className="font-semibold text-xl text-[#0A0A0A]">{formatIDR(total)}</span>
                            </div>

                            <button onClick={() => { setCart([]); alert('Sistem Reservasi & Pembayaran Bank VIP akan terbuka (Simulasi).'); onNavigate('home'); }} className="w-full mt-12 bg-[#0A0A0A] text-white py-5 font-semibold uppercase tracking-[0.25em] text-[10px] hover:bg-[#C5A059] transition-colors duration-500">
                                Konfirmasi & Amankan Koleksi
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Footer = () => (
            <footer className="bg-[#0A0A0A] text-[#F9F8F6] pt-24 pb-12 px-6 lg:px-12 border-t border-[#0A0A0A]">
                <div className="max-w-[1440px] mx-auto grid grid-cols-1 md:grid-cols-4 gap-12 mb-20">
                    <div className="md:col-span-2">
                        <h2 className="text-3xl font-serif tracking-[0.2em] mb-3 text-white uppercase">MEGA LUXURY</h2>
                        <p className="text-[#888888] text-[13px] font-light max-w-sm leading-relaxed mb-8">
                            Menghadirkan standar kemewahan Eropa ke jantung Indonesia. Setiap potong koleksi dijahit dengan presisi tanpa kompromi demi keanggunan yang abadi.
                        </p>
                    </div>
                    <div>
                        <h3 className="text-[9px] uppercase font-semibold tracking-[0.2em] text-white mb-6">Layanan Butik</h3>
                        <ul className="space-y-4 text-[11px] font-light text-[#888888]">
                            <li className="hover:text-[#C5A059] cursor-pointer transition-colors">Privat Fitting</li>
                            <li className="hover:text-[#C5A059] cursor-pointer transition-colors">Perawatan Kulit & Sutra</li>
                            <li className="hover:text-[#C5A059] cursor-pointer transition-colors">Panduan Ukuran</li>
                        </ul>
                    </div>
                    <div>
                        <h3 className="text-[9px] uppercase font-semibold tracking-[0.2em] text-white mb-6">Flagship Atelier</h3>
                        <ul className="space-y-4 text-[11px] font-light text-[#888888]">
                            <li className="leading-relaxed">
                                Cikarang Baru No. 88<br/>Kab. Bekasi, Jawa Barat<br/>Indonesia
                            </li>
                        </ul>
                    </div>
                </div>
                <div className="max-w-[1440px] mx-auto border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center text-[9px] text-[#888888] font-medium uppercase tracking-[0.2em]">
                    <p>&copy; {new Date().getFullYear()} MEGA LUXURY BY MEGA APRILIANI.</p>
                    <div className="flex space-x-6 mt-4 md:mt-0">
                        <span className="cursor-pointer hover:text-white transition-colors">Privasi</span>
                        <span className="cursor-pointer hover:text-white transition-colors">Legal</span>
                    </div>
                </div>
            </footer>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
